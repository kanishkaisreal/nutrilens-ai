<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">CarbKind AI</title>
  <desc id="description">Upload a meal photo, click Analyze, and see a meal summary, nutrition estimate, and ingredients.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#101512"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1120" cy="62" r="104" fill="#183522" opacity="0.72"/>
  <circle cx="78" cy="588" r="90" fill="#332D13" opacity="0.62"/>

  <text x="600" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#F5F5F7">CarbKind AI</text>
  <text x="600" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#A1A1AA">Snap a meal. Understand the carbs.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="300" height="315" rx="24" fill="#141416" stroke="#2B2B2F"/>
    <rect x="450" y="165" width="300" height="315" rx="24" fill="#141416" stroke="#2B2B2F"/>
    <rect x="830" y="165" width="300" height="315" rx="24" fill="#141416" stroke="#2B2B2F"/>
  </g>

  <circle cx="112" cy="207" r="23" fill="#30D158"/>
  <circle cx="492" cy="207" r="23" fill="#FFD60A"/>
  <circle cx="872" cy="207" r="23" fill="#FF9F0A"/>
  <text x="112" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#031006">1</text>
  <text x="492" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#171300">2</text>
  <text x="872" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1B0E00">3</text>

  <g stroke="#30D158" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="145" y="235" width="150" height="112" rx="14"/>
    <circle cx="260" cy="267" r="12"/>
    <path d="M160 328l42-42 27 25 20-18 31 35"/>
    <path d="M220 370v-46"/>
    <path d="M202 342l18-18 18 18"/>
  </g>
  <text x="220" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F5F5F7">Upload a meal photo</text>
  <text x="220" y="439" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A1A1AA">Choose your own image</text>
  <text x="220" y="461" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A1A1AA">or try a sample</text>

  <rect x="506" y="260" width="188" height="66" rx="18" fill="#30D158"/>
  <text x="600" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#031006">Analyze</text>
  <path d="M600 345v34" stroke="#30D158" stroke-width="6" stroke-linecap="round"/>
  <path d="M584 364l16 16 16-16" stroke="#30D158" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="600" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F5F5F7">Click Analyze</text>
  <text x="600" y="439" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A1A1AA">Demo mode works without</text>
  <text x="600" y="461" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A1A1AA">an API key</text>

  <g stroke="#30D158" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="903" y="235" width="154" height="118" rx="14"/>
    <path d="M925 265h68"/>
    <path d="M925 287h108"/>
    <path d="M925 309h84"/>
    <circle cx="1027" cy="330" r="12" fill="#183522"/>
  </g>
  <text x="980" y="397" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F5F5F7">See your results</text>
  <text x="980" y="428" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A1A1AA">Meal summary, nutrition</text>
  <text x="980" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A1A1AA">estimate, and ingredients</text>

  <path d="M391 322h38" stroke="#6E6E73" stroke-width="5" stroke-linecap="round"/>
  <path d="M419 309l13 13-13 13" stroke="#6E6E73" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M771 322h38" stroke="#6E6E73" stroke-width="5" stroke-linecap="round"/>
  <path d="M799 309l13 13-13 13" stroke="#6E6E73" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <rect x="250" y="532" width="700" height="56" rx="28" fill="#141416" stroke="#2B2B2F"/>
  <text x="600" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#F5F5F7">Fast to try in your browser • Demo mode available • Not medical advice</text>
</svg>
